<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Urvashi Kori, Data Analyst</title>
  <desc id="d">Bar chart built from shipping-container blocks with a rising trend line. The last two bars are dashed to show a forecast.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#F28C38" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F28C38" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ribs" width="9" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="20" fill="#000" opacity="0.16"/>
    </pattern>

    <g id="c0"><rect width="54" height="20" rx="3" fill="#F28C38"/><rect width="54" height="20" rx="3" fill="url(#ribs)"/></g>
    <g id="c1"><rect width="54" height="20" rx="3" fill="#4F86C6"/><rect width="54" height="20" rx="3" fill="url(#ribs)"/></g>
    <g id="c2"><rect width="54" height="20" rx="3" fill="#8FB3D9"/><rect width="54" height="20" rx="3" fill="url(#ribs)"/></g>
    <g id="cf"><rect x="1" y="1" width="52" height="18" rx="3" fill="#F28C38" fill-opacity="0.14" stroke="#F28C38" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  </defs>

  <style>
    .up{animation:up .8s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

    .fade{animation:fade .8s ease-out both}
    @keyframes fade{from{opacity:0}to{opacity:1}}

    .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s ease-out 1.2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}

    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out 0s infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}

    @media (prefers-reduced-motion:reduce){
      *{animation:none!important}
      .draw{stroke-dashoffset:0!important}
      .pulse{opacity:0}
    }
  </style>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="624" y1="58" x2="1106" y2="58"/>
    <line x1="624" y1="106" x2="1106" y2="106"/>
    <line x1="624" y1="154" x2="1106" y2="154"/>
    <line x1="624" y1="202" x2="1106" y2="202"/>
  </g>
  <line x1="624" y1="256" x2="1106" y2="256" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <g class="bar" style="animation-delay:.3s">
    <use href="#c0" x="640" y="230"/>
    <use href="#c1" x="640" y="206"/>
  </g>
  <g class="bar" style="animation-delay:.45s">
    <use href="#c1" x="706" y="230"/>
    <use href="#c2" x="706" y="206"/>
    <use href="#c0" x="706" y="182"/>
  </g>
  <g class="bar" style="animation-delay:.6s">
    <use href="#c2" x="772" y="230"/>
    <use href="#c0" x="772" y="206"/>
    <use href="#c1" x="772" y="182"/>
  </g>
  <g class="bar" style="animation-delay:.75s">
    <use href="#c0" x="838" y="230"/>
    <use href="#c1" x="838" y="206"/>
    <use href="#c2" x="838" y="182"/>
    <use href="#c0" x="838" y="158"/>
  </g>
  <g class="bar" style="animation-delay:.9s">
    <use href="#c1" x="904" y="230"/>
    <use href="#c2" x="904" y="206"/>
    <use href="#c0" x="904" y="182"/>
    <use href="#c1" x="904" y="158"/>
    <use href="#c2" x="904" y="134"/>
  </g>

  <g class="fade" style="animation-delay:2.1s">
    <use href="#cf" x="970" y="230"/><use href="#cf" x="970" y="206"/><use href="#cf" x="970" y="182"/>
    <use href="#cf" x="970" y="158"/><use href="#cf" x="970" y="134"/><use href="#cf" x="970" y="110"/>
    <use href="#cf" x="1036" y="230"/><use href="#cf" x="1036" y="206"/><use href="#cf" x="1036" y="182"/>
    <use href="#cf" x="1036" y="158"/><use href="#cf" x="1036" y="134"/><use href="#cf" x="1036" y="110"/>
    <use href="#cf" x="1036" y="86"/>
  </g>

  <path class="draw" pathLength="100" d="M667 190 L733 166 L799 166 L865 142 L931 118"
        fill="none" stroke="#F5F7FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="fade" style="animation-delay:2.3s" d="M931 118 L997 94 L1063 70"
        fill="none" stroke="#F5F7FA" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7"/>

  <g class="fade" style="animation-delay:1.6s" fill="#0F1B2D" stroke="#F5F7FA" stroke-width="2.5">
    <circle cx="667" cy="190" r="5"/><circle cx="733" cy="166" r="5"/><circle cx="799" cy="166" r="5"/>
    <circle cx="865" cy="142" r="5"/><circle cx="931" cy="118" r="5"/>
  </g>
  <g class="fade" style="animation-delay:2.4s" fill="#0F1B2D" stroke="#F28C38" stroke-width="2.5">
    <circle cx="997" cy="94" r="5"/><circle cx="1063" cy="70" r="5"/>
  </g>
  <g class="fade" style="animation-delay:2.6s">
    <circle class="pulse" cx="1063" cy="70" r="5" fill="none" stroke="#F28C38" stroke-width="2"/>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8FB3D9" letter-spacing="1">
    <text x="640" y="280">ACTUAL</text>
    <text x="970" y="280" fill="#F28C38">FORECAST</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text class="up d1" x="60" y="112" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Urvashi Kori</text>
    <rect class="up d2" x="62" y="128" width="72" height="4" rx="2" fill="#F28C38"/>
    <text class="up d2" x="60" y="176" font-size="28" font-weight="600" fill="#F28C38" letter-spacing="1">Data Analyst</text>
    <text class="up d3" x="60" y="210" font-size="20" fill="#E6ECF5">I turn business questions into decisions</text>
    <text class="up d4" x="60" y="246" font-size="15" fill="#8FB3D9" letter-spacing="0.5">Supply chain analytics · Forecasting · Self-serve insight</text>
  </g>
</svg>
